<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Awamu: phone lease desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  font-family:Inter,Arial,sans-serif;font-synthesis:none;text-rendering:optimizeLegibility;
  --navy:#0c2342;--blue:#0788cf;
  --ground:#f1f5f9;--surface:#fff;--ink:#151b2b;--soft:#687386;--line:#d8e0e8;--border:#d8e0e8;--muted:#687386;
  --brand:#0787c7;--brand-ink:#fff;--good:#0a8f5f;--sel-bg:#eff9ff;--sel-ink:#087ac0;--sel-line:#d8edfa;--hover:#f7f9fb;
  --ok-bg:#e3f6ec;--ok:#0a7a4f;--warn-bg:#fbeccb;--warn:#8a5a0b;--bad-bg:#fbe0dc;--bad:#c42a1c;--info-bg:#e2f0fb;--info:#1f6aa8;--mute-bg:#eef2f6;--mute:#556278;
  color:var(--ink);color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0a1322;--surface:#101c30;--ink:#e6edf7;--soft:#93a3b8;--line:#263a52;--border:#263a52;--muted:#93a3b8;
  --brand:#2aa6e8;--brand-ink:#04111f;--good:#3dd69b;--sel-bg:#12304a;--sel-ink:#6ccaff;--sel-line:#1d4a70;--hover:#162640;
  --ok-bg:#12382a;--ok:#5ad39b;--warn-bg:#3a2f12;--warn:#e6b450;--bad-bg:#3f1b17;--bad:#f29488;--info-bg:#15304d;--info:#8db4ee;--mute-bg:#1a2a42;--mute:#a8b8ce;color-scheme:dark;}}
:root[data-theme="dark"]{
  --ground:#0a1322;--surface:#101c30;--ink:#e6edf7;--soft:#93a3b8;--line:#263a52;--border:#263a52;--muted:#93a3b8;
  --brand:#2aa6e8;--brand-ink:#04111f;--good:#3dd69b;--sel-bg:#12304a;--sel-ink:#6ccaff;--sel-line:#1d4a70;--hover:#162640;
  --ok-bg:#12382a;--ok:#5ad39b;--warn-bg:#3a2f12;--warn:#e6b450;--bad-bg:#3f1b17;--bad:#f29488;--info-bg:#15304d;--info:#8db4ee;--mute-bg:#1a2a42;--mute:#a8b8ce;color-scheme:dark;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-width:320px;min-height:100vh;background:var(--ground);color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ---------- shell (from the supplied design) ---------- */
.topbar{height:122px;padding:0 36px;display:flex;align-items:center;gap:5.2%;color:#f5f8fc;background:linear-gradient(110deg,#0b203d,#102d52);border-bottom:1px solid #263c58}
.brand{flex:0 0 545px;display:flex;align-items:center;gap:21px;color:inherit;text-decoration:none;border:0;background:none;padding:0;text-align:left;cursor:pointer}
.brand-mark{width:76px;height:76px;flex:0 0 76px;display:grid;place-items:center;border-radius:20px;background:linear-gradient(140deg,#0aa8e0,#0872b5);box-shadow:0 8px 20px #0086c644}
.brand-mark svg{width:38px;height:38px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brand-copy{display:flex;min-width:0;flex-direction:column;gap:5px}
.brand-name{white-space:nowrap;font-size:28px;line-height:1.2;font-weight:800;letter-spacing:.3px}
.brand-name span{font-weight:700}
.brand-name b{margin-left:12px;padding:7px 12px;border:2px solid #28628f;border-radius:9px;color:#7ed9ff;background:#123d69;font-size:18px;letter-spacing:2px;vertical-align:3px}
.brand-subtitle{color:#71839c;font-size:18px;letter-spacing:.35px;white-space:nowrap}
.search-box{position:relative;height:72px;max-width:1040px;flex:1 1 500px;display:flex;align-items:center;gap:20px;padding:0 25px;border:2px solid #39506c;border-radius:15px;background:#203957;box-shadow:inset 0 1px 3px #0002}
.search-box svg{width:27px;height:27px;flex:0 0 auto;fill:none;stroke:#93a5bd;stroke-width:2;stroke-linecap:round}
.search-box input{width:100%;min-width:0;color:#fff;outline:none;border:0;background:transparent;font-size:24px;padding:0}
.search-box input::placeholder{color:#a6b4c8;opacity:1}
.sres{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:20;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(5,15,30,.3);overflow:hidden}
.sres:empty{display:none}
.sres button{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:11px 18px;cursor:pointer;border-bottom:1px solid var(--line)}
.sres button:last-child{border-bottom:0}.sres button:hover{background:var(--hover)}.sres span{color:var(--soft);font-size:13px}.sres p{margin:0;padding:14px 18px;color:var(--soft)}
.top-actions{display:flex;align-items:center;gap:16px;margin-left:auto;white-space:nowrap}
.date-chip,.role-chip,.icon-button{height:62px;display:flex;align-items:center;justify-content:center;border-radius:16px}
.date-chip{gap:17px;padding:0 24px;background:#c94f1f;color:#fff;font-size:24px;font-weight:600;letter-spacing:.4px;border:0;cursor:pointer}
.date-chip:hover{background:#b5461a}
.date-chip svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.role-chip{gap:12px;padding:0 18px;border:2px solid #354c69;background:#1b3554;color:#9cacc0;font-size:19px}
.role-chip select{width:auto;min-width:0;border:0;padding:0 2px;background:transparent;color:#08a5ea;font-weight:600;cursor:pointer;appearance:auto}
.role-chip select option{background:#fff;color:#151b2b}
.user-icon{color:#00a6ee;display:grid}.user-icon svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.icon-button{width:76px;border:2px solid #354c69;background:#1b3554;color:#cbd7e5;cursor:pointer}
.icon-button:hover{background:#24436a}
.icon-button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app-layout{display:flex;min-height:calc(100vh - 122px)}
.sidebar{width:438px;flex:0 0 438px;padding:28px 20px;background:var(--surface);border-right:1px solid var(--line)}
.sidebar nav{display:flex;flex-direction:column;gap:9px}
.nav-item{min-height:70px;display:flex;align-items:center;gap:15px;padding:0 27px;color:var(--soft);text-decoration:none;font-size:23px;font-weight:600;border-radius:10px;border:0;background:none;width:100%;text-align:left;cursor:pointer}
.nav-item:hover{background:var(--hover);color:var(--ink)}
.nav-item.selected{color:var(--sel-ink);background:var(--sel-bg);border-left:6px solid var(--brand);padding-left:21px;box-shadow:inset 0 0 0 1px var(--sel-line)}
.nav-icon{width:23px;height:23px;flex:0 0 23px}
.nav-icon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.count{min-width:39px;padding:3px 10px;text-align:center;border-radius:16px;font-size:17px;margin-left:auto;font-weight:600}
.count.blue{color:var(--info);background:var(--info-bg)}
.count.green{color:var(--ok);background:var(--ok-bg)}
.new-application{min-height:70px;margin-top:8px;color:#fff;background:#0787c7}
.new-application:hover{background:#0678b4;color:#fff}
.plus{font-size:31px;font-weight:300;line-height:1;width:23px;text-align:center}
.main-content{min-width:0;flex:1;padding:44px 48px}
.dashboard-panel{min-height:883px;padding:48px;background:var(--surface);border:1px solid var(--border)}
.overview-heading{min-height:165px;display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:31px;border-bottom:2px solid var(--border)}
.eyebrow{margin:0 0 17px;color:var(--soft);font-size:19px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
h1{margin:0;color:var(--ink);font-size:40px;letter-spacing:-1px;line-height:1.2}
#view h1{font-size:34px}#view .overview-heading h1{font-size:40px}
.intro{margin:17px 0 0;color:var(--soft);font-size:22px;letter-spacing:.1px;max-width:62ch;line-height:1.45}
.updated{margin-top:53px;color:var(--soft);font-size:20px;text-align:right}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:36px;border:2px solid var(--border)}
.metric-card{min-height:216px;padding:29px 33px 24px;border-right:2px solid var(--border)}
.metric-card:last-child{border-right:0}
.metric-card h2{margin:0 0 29px;color:var(--soft);font-size:17px;font-weight:700;letter-spacing:1px;white-space:nowrap;text-transform:uppercase}
.metric-value{margin:0;color:var(--ink);font-size:43px;line-height:1.1;font-weight:700;letter-spacing:-.02em}
.metric-note{margin:25px 0 0;color:var(--soft);font-size:19px}
.metric-note.positive{color:var(--good)}
.danger{color:var(--bad)}
.lower-grid{display:grid;grid-template-columns:minmax(0,2.1fr) minmax(320px,.95fr);gap:36px;margin-top:44px}
.content-card{min-height:309px;border:2px solid var(--border);min-width:0}
.card-heading{min-height:88px;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 27px;background:var(--mute-bg);border-bottom:2px solid var(--border)}
.card-heading h2{margin:0;color:var(--ink);font-size:22px;font-weight:500}
.role-label{padding:8px 15px;border-radius:5px;color:var(--soft);background:var(--surface);font-size:18px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
.card-body{padding:22px 27px}
.work{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 27px;border-bottom:1px solid var(--line)}
.work:last-child{border-bottom:0}.work b{font-weight:600}.work .sub{display:block;color:var(--soft);font-size:14px}
.empty-state{min-height:217px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:19px;color:var(--soft);text-align:center;padding:20px}
.empty-state p{margin:0;font-size:23px}
.empty-state strong{font-weight:700;color:var(--ink)}
.check-circle{width:39px;height:39px;display:grid;place-items:center;border:4px solid var(--good);border-radius:50%;color:var(--good)}
.check-circle svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.audit-empty{min-height:217px;display:grid;place-items:center;color:var(--soft);font-size:23px;text-align:center;padding:20px}

/* ---------- content components ---------- */
select,input[type=text],input[type=number],input[type=date],textarea,input[type=tel]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:72px;resize:vertical}
h2{font-size:19px;letter-spacing:-.01em;margin:0 0 10px;font-weight:650}
h3{font-size:15px;margin:0 0 6px;font-weight:650}
.lede{color:var(--soft);margin:0 0 22px;max-width:70ch;font-size:16px}
.muted{color:var(--soft)}.small{font-size:13px}.right{text-align:right}.nowrap{white-space:nowrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}
.panel.flat{padding:0;overflow:hidden}.panel.flat>h2,.panel.flat>.ph{padding:16px 18px 0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.ph h2{margin:0}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:18px;overflow:hidden}
.facts div{padding:14px 16px;border-right:1px solid var(--line)}.facts div:last-child{border-right:0}
.facts span{display:block;color:var(--soft);font-size:13px}.facts b{font-size:20px;letter-spacing:-.01em}
.scroll{overflow-x:auto}
table.t{width:100%;border-collapse:collapse}
.t th{text-align:left;font-weight:600;color:var(--soft);font-size:13px;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.t tr:last-child td{border-bottom:0}.t td.r,.t th.r{text-align:right}
.t tr.click{cursor:pointer}.t tr.click:hover td{background:var(--hover)}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--mute-bg);color:var(--mute);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.info{background:var(--info-bg);color:var(--info)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:550}
.btn:hover{border-color:var(--soft)}.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack>*+*{margin-top:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0}.kv dt{color:var(--soft)}.kv dd{margin:0}
.note{border-left:3px solid var(--brand);background:var(--mute-bg);padding:10px 14px;border-radius:0 8px 8px 0;font-size:14px}
.note.warn{border-color:#c58a12}.note.bad{border-color:var(--bad)}
.empty{padding:26px 18px;color:var(--soft)}
ul.plain{list-style:none;margin:0;padding:0}ul.plain li{padding:9px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}ul.plain li:last-child{border-bottom:0}
.link{background:none;border:0;padding:0;color:var(--sel-ink);cursor:pointer;font-weight:600;text-align:left}.link:hover{text-decoration:underline}
.strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.seg{position:relative;flex:1 0 96px;min-width:96px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);overflow:hidden;--c:var(--line);border-color:var(--c)}
.seg i{position:absolute;left:0;bottom:0;height:5px;background:var(--c);transition:width .4s}
.seg b{display:block;font-size:12.5px;color:var(--soft);font-weight:600}.seg em{display:block;font-style:normal;font-size:17px;font-weight:650;letter-spacing:-.01em}.seg small{display:block;color:var(--soft);font-size:12px;margin-bottom:5px}
.seg.paid{--c:var(--good);background:var(--ok-bg)}.seg.warn{--c:#c58a12}.seg.bad{--c:var(--bad);background:var(--bad-bg)}.seg.partial{--c:#c58a12}
.steps{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 4px}.step{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--mute-bg);color:var(--mute)}
.step.done{background:var(--ok-bg);color:var(--ok)}.step.now{background:var(--brand);color:var(--brand-ink);font-weight:650}
.bars{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:14px;align-items:end;height:170px;padding-top:8px}
.bars>div{display:flex;flex-direction:column;justify-content:flex-end;height:100%;align-items:center;gap:6px}
.bars .pair{display:flex;gap:4px;align-items:flex-end;height:130px;width:100%;justify-content:center}
.bars .pair i{display:block;width:40%;max-width:26px;border-radius:4px 4px 0 0;min-height:2px}
.bars .exp{background:var(--line)}.bars .col{background:var(--brand)}
.bars span{font-size:12.5px;color:var(--soft)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--soft);margin-top:8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.phone{border:1.5px solid var(--line);border-radius:16px;padding:14px;background:var(--ground);max-width:420px}
.phone p{margin:0 0 10px}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line)}.tl li{padding:0 0 12px 14px;position:relative}.tl li:before{content:"";position:absolute;left:-21px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--brand)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(520px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,20,35,.55)}
dialog form{padding:22px}.fld{margin-bottom:14px}.fld label{display:block;font-weight:600;margin-bottom:4px;font-size:14px}.fld .h{color:var(--soft);font-size:13px;margin-top:3px}
.fld.cb label{display:flex;gap:10px;align-items:flex-start;font-weight:500}.fld.cb input{margin-top:4px}
.err{background:var(--bad-bg);color:var(--bad);padding:9px 12px;border-radius:8px;margin-bottom:12px;font-size:14px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(560px,92vw)}
.toast{background:#0c2342;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.3);pointer-events:auto}
.toast.bad{background:#c42a1c;color:#fff}
input[type=checkbox]{width:auto}
.meter{height:10px;background:var(--mute-bg);border-radius:999px;overflow:hidden}.meter i{display:block;height:100%;background:var(--brand);border-radius:999px}
.doc{border:1px solid var(--line);border-radius:10px;padding:8px 22px 14px;background:var(--ground)}.doc h2{margin:12px 0 4px}.doc h3{margin:16px 0 6px;font-size:14.5px}.doc p{margin:0 0 6px;max-width:68ch}
.matrix th.c{text-align:center;white-space:normal;font-size:12px;min-width:72px;vertical-align:bottom}.matrix td.c{text-align:center}.matrix td:first-child,.matrix th:first-child{min-width:260px}
details>summary{cursor:pointer;list-style:none}details>summary::-webkit-details-marker{display:none}

.clock-chip{display:flex;align-items:center;gap:12px;height:62px;padding:0 20px;border-radius:16px;border:2px solid #354c69;background:#1b3554;color:#9cacc0;font-size:19px}
.clock-chip b{color:#e8f1fb;font-weight:600;letter-spacing:.3px}
@media (max-width:1600px){.clock-chip{height:50px;padding:0 12px;font-size:14px;gap:8px;border-radius:12px}}
@media (max-width:1050px){.clock-chip>span{display:none}}
@media (max-width:640px){.clock-chip{display:none}}
@media (max-width:1600px){
  .topbar{gap:24px;padding:0 22px}
  .brand{flex-basis:385px;gap:14px}
  .brand-mark{width:58px;height:58px;flex-basis:58px;border-radius:16px}
  .brand-mark svg{width:30px;height:30px}
  .brand-name{font-size:21px}
  .brand-name b{margin-left:4px;padding:5px 7px;font-size:13px}
  .brand-subtitle{font-size:13px}
  .search-box{height:58px}
  .search-box input{font-size:16px}
  .top-actions{gap:9px}
  .date-chip,.role-chip,.icon-button{height:50px;border-radius:12px}
  .date-chip{gap:10px;padding:0 14px;font-size:16px}
  .date-chip svg{width:20px;height:20px}
  .role-chip{padding:0 11px;font-size:14px}.user-icon svg{width:22px;height:22px}
  .icon-button{width:52px}
  .sidebar{width:280px;flex-basis:280px}
  .nav-item{padding:0 17px;font-size:17px}
  .nav-item.selected{padding-left:11px}
  .main-content{padding:32px}
  .dashboard-panel{padding:34px}
  .metric-card{padding:24px 20px}
  .metric-card h2{font-size:13px}
  .metric-value{font-size:34px}
  .metric-note{font-size:15px}
  .intro{font-size:18px}
  .lower-grid{gap:24px}
}
@media (max-width:1050px){
  .topbar{height:auto;min-height:86px;flex-wrap:wrap;padding:13px 18px;gap:12px}
  .brand{flex:1 1 360px}
  .top-actions{margin-left:0}
  .search-box{order:3;flex-basis:100%;max-width:none}
  .app-layout{min-height:calc(100vh - 158px)}
  .sidebar{width:220px;flex-basis:220px;padding:18px 12px}
  .nav-item{min-height:58px;gap:10px;padding:0 12px;font-size:14px}
  .nav-item.selected{padding-left:6px}
  .main-content{padding:22px}
  .dashboard-panel{padding:26px}
  .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .metric-card:nth-child(2){border-right:0}
  .metric-card:nth-child(-n+2){border-bottom:2px solid var(--border)}
  .lower-grid,.two{grid-template-columns:1fr}

<header class="topbar" id="topbar"></header>
<div class="app-layout">
  <aside class="sidebar"><nav id="nav" aria-label="Main"></nav></aside>

<script>
'use strict';
/* ============================================================
   Awamu engine: all business rules live here (the "server side").
   The UI only calls these methods; every sensitive method checks
   the acting role itself, so hiding a button is never the control.
   Money is stored as integer cents of KES.
   ============================================================ */
const KES = n => Math.round(n * 100);
const money = c => {
  const neg = c < 0; c = Math.abs(c);
  const s = (c / 100).toLocaleString('en-US', { minimumFractionDigits: c % 100 ? 2 : 0, maximumFractionDigits: 2 });
  return (neg ? '-' : '') + 'KES ' + s;
};
const D = {
  parse: iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); },
  iso: dt => dt.toISOString().slice(0, 10),
  addDays(iso, n) { const t = D.parse(iso); t.setUTCDate(t.getUTCDate() + n); return D.iso(t); },
  addMonths(iso, n) {
    const [y, m, d] = iso.split('-').map(Number); const tot = (m - 1) + n;
    const ny = y + Math.floor(tot / 12), nm = ((tot % 12) + 12) % 12;
    const last = new Date(Date.UTC(ny, nm + 1, 0)).getUTCDate();
    return `${ny}-${String(nm + 1).padStart(2, '0')}-${String(Math.min(d, last)).padStart(2, '0')}`;
  },
  diff: (a, b) => Math.round((D.parse(a) - D.parse(b)) / 864e5),
};
function normPhone(p) {
  let s = String(p || '').replace(/[\s\-()]/g, ''); if (s.startsWith('+')) s = s.slice(1);
  if (/^0[17]\d{8}$/.test(s)) s = '254' + s.slice(1); else if (/^[17]\d{8}$/.test(s)) s = '254' + s;
  return /^254[17]\d{8}$/.test(s) ? s : null;
}
function luhnOk(s) {
  if (!/^\d{15}$/.test(s)) return false; let sum = 0;
  for (let i = 0; i < 15; i++) { let d = +s[14 - i]; if (i % 2 === 1) { d *= 2; if (d > 9) d -= 9; } sum += d; }
  return sum % 10 === 0;
}
function makeImei(p14) {
  let sum = 0; for (let i = 0; i < 14; i++) { let d = +p14[13 - i]; if (i % 2 === 0) { d *= 2; if (d > 9) d -= 9; } sum += d; }
  return p14 + ((10 - sum % 10) % 10);
}
/* Installment schedule: equal installments, rounding difference lands on the final one. */
function buildSchedule(total, deposit, n) {
  const bal = total - deposit; if (!(n > 0) || !(bal > 0)) return [];
  const base = Math.floor(bal / n); const arr = Array(n).fill(base); arr[n - 1] = bal - base * (n - 1); return arr;
}

const ROLES = ['Super Admin', 'Product Admin', 'Sales Agent', 'Customer', 'Credit/Risk Officer', 'Approver', 'Senior Approver', 'Inventory Officer', 'Finance Officer', 'Finance Approver', 'Collections Officer', 'Auditor', 'Compliance Officer'];
/* Minimum access from the business matrix. Super Admin can change these at runtime; segregation-of-duties rules stay in code. */
const DEFAULT_PERMS = {
  'customer.register': ['Sales Agent', 'Customer'],
  'app.create': ['Sales Agent', 'Customer'],
  'app.submit': ['Sales Agent', 'Customer'],
  'kyc.verify': ['Credit/Risk Officer', 'KYC Service'],
  'app.refer': ['Credit/Risk Officer', 'Approver', 'Senior Approver', 'Super Admin'],
  'app.decide': ['Approver', 'Senior Approver', 'Super Admin'],
  'app.cancel': ['Sales Agent', 'Customer', 'Approver', 'Senior Approver'],
  'risk.view': ['Credit/Risk Officer', 'Approver', 'Senior Approver', 'Auditor', 'Compliance Officer', 'Super Admin'],
  'pricing.manage': ['Super Admin', 'Product Admin'],
  'pricing.activate': ['Super Admin', 'Product Admin'],
  'settings': ['Super Admin'],
  'perms.manage': ['Super Admin'],
  'device.manage': ['Inventory Officer'],
  'handover': ['Inventory Officer'],
  'agreement.generate': ['Sales Agent', 'Approver', 'Senior Approver', 'Super Admin'],
  'agreement.accept': ['Customer', 'Sales Agent'],
  'agreement.authorize': ['Approver', 'Senior Approver', 'Super Admin'],
  'payment.initiate': ['Customer', 'Sales Agent', 'Collections Officer', 'Finance Officer'],
  'payment.reconcile': ['Finance Officer'],
  'adjust.request': ['Finance Officer'],
  'adjust.approve': ['Finance Approver'],
  'collections.record': ['Collections Officer'],
  'dispute.manage': ['Finance Officer', 'Collections Officer'],
  'ownership.transfer': ['Finance Officer', 'Super Admin'],
  'audit.view': ['Auditor', 'Compliance Officer', 'Super Admin'],
};
/* [action, label, wording from the matrix, extra note] */
const PERM_ROWS = [
  ['customer.register', 'Register customer'], ['app.submit', 'Submit application'], ['app.create', 'Start and edit an application'],
  ['kyc.verify', 'Verify KYC and record the credit assessment', 'Credit/Risk Officer or an authorized verification service'],
  ['app.refer', 'Request information, hold or escalate an application'],
  ['app.decide', 'Approve or reject application', 'Approver within assigned limits'],
  ['risk.view', 'View risk and credit assessment data'],
  ['pricing.manage', 'Configure prices and lease durations'], ['pricing.activate', 'Activate pricing'],
  ['device.manage', 'Register and allocate devices'], ['handover', 'Record handover'],
  ['agreement.generate', 'Generate lease agreement', 'System; authorized staff may initiate'],
  ['agreement.accept', 'Accept agreement (customer side)'], ['agreement.authorize', 'Authorize agreement (company representative)'],
  ['payment.initiate', 'Initiate M-PESA STK Push', 'Customer-facing application or authorized staff action'],
  ['payment.reconcile', 'Reconcile exceptions'], ['collections.record', 'Record collection follow-up'], ['dispute.manage', 'Open and resolve disputes'],
  ['adjust.request', 'Request waiver, refund or adjustment'], ['adjust.approve', 'Approve waiver, refund or adjustment', 'Authorized Finance Approver'],
  ['ownership.transfer', 'Transfer ownership by exception', 'Normally done by the system after checks'],
  ['audit.view', 'View audit records'], ['app.cancel', 'Cancel an application'], ['settings', 'Edit policy settings'], ['perms.manage', 'Change this permission matrix'],
];
const SYSTEM_ONLY = [['Confirm payment', 'Only the verified payment integration and the reconciliation process. No person can mark a payment as paid.'], ['Transfer ownership', 'Done by the system once every completion check passes. Staff handle exceptions only.']];
const DOC_KINDS = { nationalId: 'National ID or passport', proofIncome: 'Proof of income (M-PESA statement or payslip)' };
const REASON_CODES = {
  reject: [['IDENTITY', 'Identity could not be verified'], ['AFFORDABILITY', 'Repayment capacity is not sufficient'], ['HISTORY', 'Adverse payment history with the company'], ['FRAUD', 'Fraud indicators'], ['LIMIT', 'Exceeds risk limits'], ['ELIGIBILITY', 'Does not meet product eligibility rules'], ['DOCS', 'Documents invalid or incomplete'], ['OTHER', 'Other reason']],
  info: [['DOCS_MISSING', 'Documents missing or unclear'], ['INCOME', 'Income or cash-flow evidence needed'], ['OBLIGATIONS', 'Existing obligations to be confirmed'], ['IDENTITY_INFO', 'Identity details to be confirmed'], ['OTHER_INFO', 'Other information needed']],
  hold: [['CALLBACK', 'Awaiting verification call'], ['FRAUD_REVIEW', 'Fraud review in progress'], ['LIMIT_REVIEW', 'Awaiting senior limit review'], ['STOCK', 'Awaiting stock or product availability'], ['OTHER_HOLD', 'Other reason']],
};
const CLAUSE_KEYS = ['payment', 'late', 'warranty', 'dispute', 'completion', 'cancellation', 'early', 'termination'];
const CLAUSE_TITLES = { payment: 'Payment methods and instructions', late: 'Late-payment terms', warranty: 'Warranty, loss and damage', dispute: 'Disputes', completion: 'Completion and ownership transfer', cancellation: 'Cancellation', early: 'Early settlement', termination: 'Termination' };
const DEFAULT_CLAUSES = {
  payment: `The deposit and each installment are paid by M-PESA. Pay when prompted by an STK Push sent to {phone}, or pay to Paybill {paybill} using your lease number as the account number. The amount on every prompt comes from this agreement. A payment counts only after M-PESA confirms it.`,
  late: `Each installment has a grace period of {grace} calendar days after its due date. If it is still unpaid after the grace period it is marked overdue and our collections team will contact you. No late fee or penalty is charged under this agreement. The unpaid amount stays payable.`,
  warranty: `The phone carries the manufacturer's warranty for its model. Until ownership transfers, the phone remains the property of {company}. You must keep it in good condition and report loss, theft or damage within 48 hours. Loss or damage does not cancel your remaining installments unless we agree in writing.`,
  dispute: `If you believe a payment or charge is wrong, tell us in writing or by phone. We will record the dispute, review the payment history and reply within 14 days. Payment records are never deleted while a dispute is investigated. Unresolved disputes may be taken to the courts of Kenya.`,
  completion: `Ownership of the phone transfers to you once the deposit and every installment are paid and confirmed, and no payment or dispute is unresolved. We will issue a completion certificate that records the transfer date.`,
  cancellation: `You may cancel before the phone is handed over. Any deposit you have paid will be refunded in full after verification, because this agreement states no cancellation charge. After handover the lease ends only by early settlement or termination.`,
  early: `You may settle early at any time. The settlement amount is the unpaid balance of the installments, less any credit we hold for you. No penalty is added and no rebate is promised, because neither is in this agreement. A settlement quote is available on request.`,
  termination: `We may end the lease if an installment stays unpaid after the grace period and after written notice that gives you a reasonable time to pay. On termination the phone must be returned in reasonable condition, and amounts already paid are accounted for under applicable law.`,
};

class Engine {
  constructor(s) { this.s = s || Engine.blank(); this.role = 'Super Admin'; }
  static blank(date = '2026-10-14') {
    return {
      v: 3, date, perms: JSON.parse(JSON.stringify(DEFAULT_PERMS)), seq: {},
      settings: { durations: [3, 6, 9, 12], graceDays: 3, reminderOffsets: [-3, 0, 1, 2, 3], reservationDays: 7, approverLimit: KES(60000), affordability: 40, minAge: 18, escalationDays: 14, oneActiveApp: true, company: 'Awamu Mobile Ltd', paybill: '400200', seniorLimit: KES(250000), exposureLimit: KES(120000), maxDsr: 60, minIncome: KES(10000), premiumThreshold: KES(40000), premiumMinIncome: KES(35000), maxActiveLeases: 2, reviewSlaDays: 2, autoOwnership: true, agents: ['Amina Wanjiku', 'Brian Otieno', 'Cheptoo Rono'], officers: ['Grace Muthoni', 'Peter Kiplagat'], lowStock: 2, clauses: JSON.parse(JSON.stringify(DEFAULT_CLAUSES)) },
      products: [], pricings: [], customers: [], apps: [], devices: [], leases: [], payments: [], events: [],
      ledger: [], tasks: [], notifs: [], adjustments: [], disputes: [], audit: [], receipts: {},
      sim: { providerDown: false, failNextPost: false },
    };
  }
  /* ---------- plumbing ---------- */
  id(p) { const n = (this.s.seq[p] = (this.s.seq[p] || 0) + 1); return p + '-' + String(n).padStart(4, '0'); }
  fail(m) { throw new Error(m); }
  can(a) { return (this.s.perms[a] || []).includes(this.role); }
  need(a) {
    if (!this.can(a)) { this.log('DENIED', a, `${this.role} attempted "${a}" and was refused`, 'SECURITY'); this.fail(`Permission denied: ${this.role} cannot perform this action.`); }
  }
  log(action, entity, detail, kind = 'INFO') {
    this.s.audit.push({ id: this.id('AUD'), ts: new Date().toISOString(), date: this.s.date, actor: this.role, action, entity, detail, kind });
  }
  as(role, fn) { const keep = this.role; this.role = role; try { return fn(); } finally { this.role = keep; } }
  atomic(fn) {
    const keys = ['ledger', 'payments', 'receipts', 'leases', 'apps', 'devices', 'tasks', 'notifs'];
    const snap = JSON.stringify(keys.map(k => this.s[k]));
    try { return fn(); } catch (e) { const a = JSON.parse(snap); keys.forEach((k, i) => this.s[k] = a[i]); throw e; }
  }
  get(list, id, label) { const x = this.s[list].find(o => o.id === id); if (!x) this.fail(`${label} ${id} not found`); return x; }
  app(id) { return this.get('apps', id, 'Application'); }
  lease(id) { return this.get('leases', id, 'Lease'); }
  cust(id) { return this.get('customers', id, 'Customer'); }
  pricing(id) { return this.get('pricings', id, 'Pricing'); }
  product(id) { return this.get('products', id, 'Product'); }
  device(id) { return this.get('devices', id, 'Device'); }
  pay(id) { return this.get('payments', id, 'Payment'); }
  leaseOfApp(a) { return a.leaseId ? this.lease(a.leaseId) : null; }

  /* ---------- catalogue & pricing ---------- */
  addProduct(d) {
    this.need('pricing.manage');
    if (!d.code || !d.brand || !d.model) this.fail('Product code, brand and model are required.');
    if (this.s.products.some(p => p.code === d.code)) this.fail(`Product code ${d.code} already exists.`);
    const p = { id: d.code, code: d.code, brand: d.brand, model: d.model, storage: d.storage || '', condition: d.condition || 'New', cashPrice: d.cashPrice, status: d.status || 'Active' };
    this.s.products.push(p); this.log('PRODUCT', p.code, `Product added: ${p.brand} ${p.model}`); return p;
  }
  depositOf(p) { return p.depositType === 'percent' ? Math.round(p.total * p.depositValue / 100 / 100) * 100 : p.depositValue; }
  validatePricing(p) {
    const err = [], S = this.s.settings;
    if (!this.s.products.find(x => x.id === p.productId)) err.push('Product not found.');
    if (!Number.isInteger(p.months) || p.months <= 0) err.push('Duration must be a positive whole number of months.');
    else if (!S.durations.includes(p.months)) err.push(`${p.months} months is not a permitted duration (${S.durations.join(', ')}).`);
    if (!(p.total > 0)) err.push('Total lease price must be positive.');
    if (p.depositType === 'percent' && !(p.depositValue > 0 && p.depositValue < 100)) err.push('Deposit percentage must be above 0 and below 100.');
    const dep = this.depositOf(p);
    if (!(dep > 0)) err.push('Deposit must be positive.'); else if (dep >= p.total) err.push('Deposit must be less than the total lease price.');
    if (!p.from) err.push('Effective start date is required.');
    if (p.to && p.to < p.from) err.push('Effective end date is before the start date.');
    if (!Number.isInteger(p.graceDays) || p.graceDays < 0) err.push('Grace period must be a whole number of days.');
    if (!Array.isArray(p.reminderOffsets) || p.reminderOffsets.some(x => !Number.isInteger(x))) err.push('Reminder schedule must be whole days relative to the due date.');
    if (!err.length) { const sch = buildSchedule(p.total, dep, p.months); if (sch.length !== p.months || dep + sch.reduce((a, b) => a + b, 0) !== p.total) err.push('Installment schedule does not reconcile to the total.'); }
    return err;
  }
  addPricing(d) {
    this.need('pricing.manage'); this.product(d.productId);
    const same = this.s.pricings.filter(x => x.productId === d.productId && x.months === d.months);
    const p = {
      id: this.id('PRC'), productId: d.productId, months: d.months, total: d.total, depositType: d.depositType || 'fixed', depositValue: d.depositValue,
      frequency: 'Monthly', graceDays: d.graceDays ?? this.s.settings.graceDays, reminderOffsets: d.reminderOffsets || [...this.s.settings.reminderOffsets],
      from: d.from || this.s.date, to: d.to || null, status: 'Draft', version: same.length ? Math.max(...same.map(x => x.version)) + 1 : 1,
      createdBy: this.role, supersedes: d.supersedes || null,
    };
    this.s.pricings.push(p); this.log('PRICING', p.id, `Draft v${p.version} created: ${p.months} months, ${money(p.total)}`); return p;
  }
  revisePricing(id, ch) {
    this.need('pricing.manage'); const o = this.pricing(id);
    return this.addPricing({ ...o, ...ch, supersedes: o.id });
  }
  activatePricing(id) {
    this.need('pricing.activate'); const p = this.pricing(id);
    if (p.status === 'Active') this.fail('This pricing is already active.');
    if (p.createdBy === this.role && this.role !== 'Super Admin') this.fail('Segregation of duties: a Super Admin (or another approver) must activate pricing you created.');
    const e = this.validatePricing(p); if (e.length) this.fail('Cannot activate: ' + e.join(' '));
    this.s.pricings.filter(x => x.productId === p.productId && x.months === p.months && x.status === 'Active').forEach(x => { x.status = 'Inactive'; x.supersededBy = p.id; });
    p.status = 'Active'; p.approvedBy = this.role; p.approvedAt = this.s.date;
    this.log('PRICING', p.id, `Activated v${p.version} (${money(p.total)}). Earlier versions stay attached to signed agreements.`); return p;
  }
  deactivatePricing(id) { this.need('pricing.activate'); const p = this.pricing(id); p.status = 'Inactive'; this.log('PRICING', p.id, 'Deactivated for new applications'); return p; }
  pricingAvailable(p) {
    const t = this.s.date; const prod = this.s.products.find(x => x.id === p.productId);
    return p.status === 'Active' && p.from <= t && (!p.to || t <= p.to) && prod && prod.status === 'Active';
  }
  buildOffer(p) {
    const dep = this.depositOf(p); const inst = buildSchedule(p.total, dep, p.months);
    return { pricingId: p.id, pricingVersion: p.version, productId: p.productId, months: p.months, total: p.total, deposit: dep, balance: p.total - dep, installments: inst, count: inst.length, frequency: p.frequency, graceDays: p.graceDays, reminderOffsets: [...p.reminderOffsets] };
  }
  updateSettings(o) { this.need('settings'); Object.assign(this.s.settings, o); this.log('SETTINGS', 'policy', JSON.stringify(o)); }

  /* ---------- customers ---------- */
  registerCustomer(d) {
    this.need('customer.register');
    const err = []; const phone = normPhone(d.phone);
    if (!d.name || d.name.trim().length < 3) err.push('Full name is required.');
    if (!/^\d{7,8}$/.test(d.idNo || '')) err.push('National ID must be 7 or 8 digits.');
    if (!phone) err.push('Enter a valid Safaricom number, for example 0712 345 678.');
    const dob = d.dob && D.parse(d.dob); const age = dob ? Math.floor(D.diff(this.s.date, d.dob) / 365.25) : -1;
    if (!dob || isNaN(dob)) err.push('Date of birth is required.'); else if (age < this.s.settings.minAge) err.push(`Customer must be at least ${this.s.settings.minAge} years old.`);
    if (!d.consent) err.push('Customer consent to data processing is required.');
    if (err.length) this.fail(err.join(' '));
    const dup = this.s.customers.find(c => c.idNo === d.idNo || c.phone === phone);
    if (dup) this.fail(`Possible duplicate of ${dup.id} (${dup.name}). Review that profile instead of creating another.`);
    const c = { id: this.id('CUS'), name: d.name.trim(), idNo: d.idNo, phone, dob: d.dob, consent: { given: true, at: this.s.date }, kyc: { status: 'Pending', by: null, at: null, note: '' }, createdAt: this.s.date };
    this.s.customers.push(c); this.log('CUSTOMER', c.id, `Registered ${c.name}`); return c;
  }

  /* ---------- inventory ---------- */
  registerDevice(d) {
    this.need('device.manage'); this.product(d.productId);
    if (!luhnOk(d.imei)) this.fail('IMEI must be 15 digits with a valid check digit.');
    if (this.s.devices.some(x => x.imei === d.imei)) this.fail(`IMEI ${d.imei} is already registered.`);
    const v = { id: this.id('DEV'), imei: d.imei, productId: d.productId, condition: d.condition || 'New', status: 'In Stock', applicationId: null, history: [] };
    this.s.devices.push(v); this.devEvent(v, 'Registered into stock'); this.log('DEVICE', v.id, `Registered IMEI ${v.imei}`); return v;
  }
  devEvent(d, event) { (d.history = d.history || []).push({ date: this.s.date, ts: new Date().toISOString(), by: this.role, event }); }
  freeDevice(productId) { return this.s.devices.find(d => d.productId === productId && d.status === 'In Stock'); }
  setQuarantine(id, on, reason) {
    this.need('device.manage'); const d = this.device(id);
    if (on) { if (d.status !== 'In Stock') this.fail('Only in-stock devices can be quarantined.'); d.status = 'Quarantined'; }
    else { if (d.status !== 'Quarantined') this.fail('Device is not quarantined.'); d.status = 'In Stock'; }
    this.devEvent(d, `${on ? 'Quarantined' : 'Released from quarantine'}: ${reason || 'no reason given'}`); this.log('DEVICE', d.id, `${on ? 'Quarantined' : 'Released'}: ${reason || 'no reason given'}`);
  }
  reserveDevice(appId, devId) {
    this.need('device.manage'); const a = this.app(appId), d = this.device(devId);
    if (!['Agreement Pending', 'Deposit Pending'].includes(a.status)) this.fail(`Application is ${a.status}. A phone can be reserved once the application is approved.`);
    if (a.deviceId) this.fail('A device is already reserved for this application.');
    if (d.productId !== a.offer.productId) this.fail('Device model does not match the approved product.');
    if (d.status !== 'In Stock') this.fail(`Device is not available (status: ${d.status}).`);
    d.status = 'Reserved'; d.applicationId = a.id; a.deviceId = d.id; this.devEvent(d, `Reserved for ${a.ref}`); this.log('DEVICE', d.id, `Reserved for ${a.ref}`); this.checkReady(a); return d;
  }
  releaseDevice(a, why) {
    if (!a.deviceId) return; const d = this.device(a.deviceId);
    if (d.status === 'Reserved') { d.status = 'In Stock'; d.applicationId = null; this.devEvent(d, `Reservation released: ${why}`); this.log('DEVICE', d.id, `Reservation released: ${why}`); }
    a.deviceId = null;
  }

  /* ---------- disputes, adjustments, collections ---------- */

  /* ---------- completion ---------- */

    return [
      { label: 'Contractual balance is zero', ok: !!L.activationDate && this.outstanding(L) <= 0, detail: this.outstanding(L) > 0 ? `${money(this.outstanding(L))} still owed` : '' },
      { label: 'No pending or quarantined payments', ok: pend.length === 0, detail: pend.length ? `${pend.length} payment(s) unresolved` : '' },

  return `<div class="ph"><div><h1>Roles and access</h1><p class="lede" style="margin:0">The approved minimum access is the starting point. A Super Admin can grant or remove access, and every change goes to the audit log. The safeguards below cannot be switched off.</p></div>${btn('permReset', 'Reset to approved defaults', { off: !can })}</div>
  ${can ? '' : `<div class="note warn" style="margin:14px 0">You are acting as ${esc(E.role)}. Only a Super Admin can change access. Switch role at the top to edit.</div>`}
  <div class="panel flat scroll" style="margin-top:14px"><table class="t matrix"><thead><tr><th>Action</th>${ROLES.map(r => `<th class="c">${r}</th>`).join('')}</tr></thead><tbody>${PERM_ROWS.map(([act, label, note]) => `<tr><td>${label}${note ? `<br><span class="muted small">${note}</span>` : ''}</td>${ROLES.map(r => `<td class="c"><input type="checkbox" data-act="perm" data-a="${act}" data-r="${r}" ${E.s.perms[act].includes(r) ? 'checked' : ''} ${can ? '' : 'disabled'} aria-label="${r}: ${label}"></td>`).join('')}</tr>`).join('')}</tbody></table></div>
  <div class="three"><div class="panel"><h2>Approval limits</h2><dl class="kv"><dt>Approver</dt><dd>Up to ${$m(S.approverLimit)}</dd><dt>Senior Approver</dt><dd>Up to ${$m(S.seniorLimit)}</dd><dt>Above that</dt><dd>Super Admin</dd></dl><p class="muted small">Measured on the total lease price. Larger applications are escalated.</p>${btn('settings', 'Edit limits', { sm: 1, off: !E.can('settings') })}</div>
  <div class="panel"><h2>Verification service</h2><label class="row"><input type="checkbox" data-act="perm" data-a="kyc.verify" data-r="KYC Service" ${E.s.perms['kyc.verify'].includes('KYC Service') ? 'checked' : ''} ${can ? '' : 'disabled'}> The automated verification service may record KYC results</label></div>
  <div class="panel"><h2>System only</h2><ul class="plain">${SYSTEM_ONLY.map(([t, d]) => `<li><span><b>${t}</b><br><span class="muted small">${d}</span></span>${chip('Locked')}</li>`).join('')}</ul></div></div>
  <div class="panel"><h2>Safeguards that always apply</h2><ul class="plain"><li>Nobody can approve a decision, or authorize an agreement, on an application they created.</li><li>Pricing created by a Product Admin must be activated by someone else, or by a Super Admin.</li><li>An adjustment needs a reason, and a Finance Approver other than the requester must approve it.</li><li>Successful payments cannot be deleted. Mistakes are reversed with a linked entry.</li><li>No one can edit a balance or mark a lease paid by hand.</li><li>Every permission change is audited, and Super Admin always keeps the right to change access.</li></ul></div>`;
}

/* ---------- leases ---------- */
function leaseChips(L) { const s = E.leaseStatus(L); return chip(s.status) + s.flags.map(f => ' ' + chip(f)).join(''); }
function vLeases() {
  const rows = E.s.leases.filter(L => !myCust() || L.customerId === myCust()).slice().reverse();
  return `<h1>Leases</h1><p class="lede">One row per signed agreement. Open a lease for its schedule, ledger and payments.</p><div class="panel flat scroll"><table class="t"><thead><tr><th>Lease</th><th>Customer</th><th>Phone</th><th>Status</th><th class="r">Outstanding</th><th>Next due</th></tr></thead><tbody>${rows.map(L => { const n = E.nextInstallment(L); const a = E.app(L.appId); return `<tr class="click" data-act="openLease" data-id="${L.id}"><td><b>${L.id}</b></td><td>${esc(custName(L.customerId))}</td><td>${esc(prodName(L.terms.productId))}</td><td>${leaseChips(L)}</td><td class="r">${$m(E.outstanding(L))}</td><td>${L.activationDate ? (n ? `${fd(n.due)}, ${$m(E.instOutstanding(L, n))}` : 'Nothing due') : '<span class="muted">' + esc(a.status) + '</span>'}</td></tr>`; }).join('') || '<tr><td colspan="6" class="empty">No signed agreements yet.</td></tr>'}</tbody></table></div>`;
}
function stripHtml(L) {
  const segs = []; const dp = E.paidOn(L, 'deposit');
  segs.push(`<div class="seg ${dp >= L.terms.deposit ? 'paid' : 'warn'}" style="--c:${dp >= L.terms.deposit ? 'var(--good)' : '#C58A12'}"><b>Deposit</b><small>${fd(L.signedOn)}</small><em>${$m(L.terms.deposit)}</em><i style="width:${Math.min(100, dp / L.terms.deposit * 100)}%"></i></div>`);
  const src = L.installments.length ? L.installments : L.terms.installments.map((a, i) => ({ id: null, no: i + 1, due: null, amount: a }));
  src.forEach(i => { let cls = '', pct = 0, lab = 'Scheduled'; if (i.id) { const st = E.instState(L, i); pct = st.paid / i.amount * 100; lab = st.status; cls = st.status === 'Paid' ? 'paid' : st.status === 'Overdue' ? 'bad' : ['Grace Period', 'Due', 'Partially Paid'].includes(st.status) ? 'warn' : ''; }
    segs.push(`<div class="seg ${cls}" title="${lab}"><b>Installment ${i.no}</b><small>${i.due ? fd(i.due) : 'After handover'}</small><em>${$m(i.amount)}</em><i style="width:${pct}%"></i></div>`); });
  return `<div class="strip" role="img" aria-label="Repayment progress">${segs.join('')}</div>`;
}
function vLease() {
  const L = E.lease(ui.leaseId), c = E.cust(L.customerId), a = E.app(L.appId), st = E.leaseStatus(L); const paid = E.totalPaid(L), out = E.outstanding(L), cr = E.creditBalance(L), nxt = E.nextInstallment(L);
  const act = [];
  if (L.activationDate && !L.closed) {
    if (E.can('payment.initiate') && nxt) act.push(btn('stk', `Collect installment ${nxt.no} (${$m(E.instOutstanding(L, nxt))})`, { cls: 'primary', d: { purpose: 'installment', inst: nxt.id } }));
    if (E.can('payment.initiate') && out > 0) act.push(btn('quote', 'Settlement quote'));
    if (E.can('dispute.manage')) act.push(btn('dispute', 'Open dispute'));
    if (E.can('adjust.request')) act.push(btn('adjust', 'Request adjustment'));
    if (E.can('ownership.transfer')) act.push(btn('checks', 'Run completion checks') + btn('transfer', 'Complete ownership transfer', { cls: out <= 0 ? 'primary' : '' }));
  }
  const pays = E.s.payments.filter(p => p.leaseId === L.id).slice().reverse(), led = E.entries(L).slice().reverse();
  const tasks = E.s.tasks.filter(t => t.leaseId === L.id), dis = E.s.disputes.filter(d => d.leaseId === L.id), adj = E.s.adjustments.filter(x => x.leaseId === L.id);
  const notes = E.s.notifs.filter(n => n.leaseId === L.id).slice(-8).reverse();
  return `<button class="link small" data-act="nav" data-id="leases">Back to leases</button>
  <div class="ph" style="margin-top:8px"><div><h1>${L.id}: ${esc(c.name)}</h1><div class="row">${leaseChips(L)}<span class="muted">${esc(prodName(L.terms.productId))}${L.handover ? ', IMEI ' + L.handover.imei : ''}</span></div></div><button class="link" data-act="openApp" data-id="${a.id}">View application ${a.ref}</button></div>
  <div class="facts"><div><span>Total payable</span><b>${$m(L.terms.total)}</b></div><div><span>Paid so far</span><b>${$m(paid)}</b></div><div><span>Outstanding</span><b>${$m(out)}</b></div><div><span>Credit held</span><b>${$m(cr)}</b></div><div><span>Next due</span><b>${nxt ? fd(nxt.due) : 'None'}</b></div></div>
  <div class="panel"><div class="ph"><h2>Repayment</h2><span class="muted small">Signed ${fd(L.signedOn)}${L.activationDate ? ', handed over ' + fd(L.activationDate) : ''}. Terms are fixed at price version ${L.terms.pricingVersion}.</span></div>${stripHtml(L)}${act.length ? `<div class="row" style="margin-top:12px">${act.join('')}</div>` : ''}${L.ownership ? `<div class="note" style="margin-top:12px"><b>Ownership transferred</b> on ${fd(L.ownership.date)}. Certificate ${L.ownership.certificate}, IMEI ${L.ownership.imei}.</div>` : ''}${L.ownershipPending ? '<div class="note" style="margin-top:12px">All completion checks pass. The transfer can now be recorded.</div>' : ''}</div>
  ${L.installments.length ? `<div class="panel flat scroll"><h2>Schedule</h2><table class="t" style="margin-top:8px"><thead><tr><th>No.</th><th>Due</th><th class="r">Amount</th><th class="r">Paid</th><th class="r">Outstanding</th><th>Status</th></tr></thead><tbody>${L.installments.map(i => { const s = E.instState(L, i); return `<tr><td>${i.no}</td><td>${fd(i.due)}</td><td class="r">${$m(i.amount)}</td><td class="r">${$m(s.paid)}</td><td class="r">${$m(s.outstanding)}</td><td>${chip(s.status)}${s.partial && s.status !== 'Partially Paid' ? ' ' + chip('Partially Paid') : ''}${s.disputed && s.outstanding ? ' ' + chip('Disputed') : ''}</td></tr>`; }).join('')}</tbody></table></div>` : ''}
  <div class="two"><div class="panel flat scroll"><h2>Ledger</h2><table class="t" style="margin-top:8px"><thead><tr><th>Date</th><th>Entry</th><th class="r">Cash in</th><th>Applied to</th></tr></thead><tbody>${led.map(e => `<tr><td>${fd(e.date)}</td><td>${e.type.replace('_', ' ').toLowerCase()}${e.receipt ? `<br><span class="muted small">${e.receipt}</span>` : ''}${e.reason ? `<br><span class="muted small">${esc(e.reason)}</span>` : ''}</td><td class="r">${e.cash ? $m(e.cash) : ''}</td><td>${e.allocations.map(x => `${x.target === 'deposit' ? 'Deposit' : 'Inst. ' + x.target.split('-I')[1]} ${$m(x.amount)}`).join(', ')}${e.credit ? `<br><span class="muted small">Credit ${$m(e.credit)}</span>` : ''}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">Nothing posted yet.</td></tr>'}</tbody></table></div>
  <div class="stack"><div class="panel flat scroll"><h2>Payments</h2><table class="t" style="margin-top:8px"><tbody>${pays.map(p => `<tr><td>${p.id}<br><span class="muted small">${p.channel}, ${p.purpose}</span></td><td class="r">${$m(p.amount)}</td><td>${chip(p.status)}</td></tr>`).join('') || '<tr><td class="empty">No payments yet.</td></tr>'}</tbody></table></div>
  ${(dis.length || tasks.length || adj.length) ? `<div class="panel"><h2>Follow-up</h2><ul class="plain">${dis.map(d => `<li><span>${chip(d.status === 'Open' ? 'Disputed' : 'Resolved')} ${esc(d.reason)}${d.outcome ? `<br><span class="muted small">Outcome: ${esc(d.outcome)}</span>` : ''}</span>${d.status === 'Open' && E.can('dispute.manage') ? btn('resolveDispute', 'Resolve', { sm: 1, d: { id: d.id } }) : ''}</li>`).join('')}${tasks.map(t => `<li><span>${esc(t.stage)}, installment ${t.instId.split('-I')[1]}</span>${chip(t.status)}</li>`).join('')}${adj.map(x => `<li><span>${x.type} of ${$m(x.amount)}<br><span class="muted small">${esc(x.reason)}</span></span><span>${chip(x.status)}${x.status === 'Pending approval' && E.can('adjust.approve') ? btn('adjDecide', 'Approve', { sm: 1, cls: 'primary', d: { id: x.id, ok: 1 } }) + btn('adjDecide', 'Decline', { sm: 1, d: { id: x.id, ok: 0 } }) : ''}</span></li>`).join('')}</ul></div>` : ''}
  ${notes.length ? `<div class="panel"><h2>Recent messages</h2><ul class="plain">${notes.map(n => `<li><span>${fd(n.date)}: ${n.template}</span>${chip(n.status)}</li>`).join('')}</ul></div>` : ''}</div></div>`;
}

/* ---------- payments ---------- */
function vPayments() {
  const mc = myCust(), PS = E.s.payments.filter(p => !mc || p.customerId === mc); const pend = PS.filter(p => p.status === 'Pending' && p.channel === 'STK Push'), quar = PS.filter(p => p.status === 'Quarantined');
  const unm = E.s.events.filter(e => e.status === 'Unmatched' && e.kind === 'C2B'), retry = E.s.events.filter(e => e.status === 'Retry queued');
  const sim = E.s.sim;
  const phones = pend.map(p => `<div class="phone"><p><b>M-PESA prompt on ${esc(p.phone)}</b><br>Pay ${$m(p.amount)} to Awamu Mobile Ltd for ${p.purpose} ${esc(p.leaseId)}? Enter your PIN.</p><div class="row">${btn('simPay', 'Enter PIN and pay', { cls: 'primary', sm: 1, d: { id: p.id } })}${btn('simCode', 'Cancel', { sm: 1, d: { id: p.id, code: 1032 } })}${btn('simCode', 'No response', { sm: 1, d: { id: p.id, code: 1037 } })}${btn('simCode', 'Insufficient funds', { sm: 1, d: { id: p.id, code: 1 } })}${btn('simWrong', 'Pay a different amount', { sm: 1, d: { id: p.id } })}${btn('simSpoof', 'Send a forged callback', { sm: 1, d: { id: p.id } })}</div></div>`).join('');
  const all = PS.slice().reverse().slice(0, 40), evs = E.s.events.slice().reverse().slice(0, 14);
  return `<h1>Payments</h1><p class="lede">An STK Push request only asks the customer to pay. Money is recorded when a verified callback arrives. The panel on the left plays the customer and Safaricom so you can try every outcome.</p>
  <div class="two"><div class="panel"><div class="ph"><h2>Customer's phone</h2></div>${phones || '<div class="empty" style="padding:6px 0">No prompts waiting. Request a deposit or installment from an application or lease.</div>'}</div>
  <div class="panel" ${mc ? 'hidden' : ''}><h2>Simulator switches</h2><div class="stack"><label class="row"><input type="checkbox" data-act="toggle" data-k="providerDown" ${sim.providerDown ? 'checked' : ''}> Safaricom is unreachable for new requests</label><label class="row"><input type="checkbox" data-act="toggle" data-k="failNextPost" ${sim.failNextPost ? 'checked' : ''}> Database fails on the next ledger posting</label><div>${btn('c2b', 'Send a paybill payment')}</div></div></div></div>
  <div class="panel" ${mc ? 'hidden' : ''}><div class="ph"><h2>Reconciliation queue</h2></div>${quar.length || unm.length || retry.length ? `<ul class="plain">${quar.map(p => `<li><span><b>${p.id}</b> ${chip('Quarantined')} received ${$m(p.receivedAmount)}, expected ${$m(p.amount)}<br><span class="muted small">${esc(p.leaseId)}, receipt ${esc(p.providerTxId)}. Not applied to the account.</span></span>${E.can('payment.reconcile') ? `<span class="row">${btn('resolveQ', 'Apply as received', { sm: 1, d: { id: p.id, k: 'apply' } })}${btn('resolveQ', 'Do not apply', { sm: 1, d: { id: p.id, k: 'reject' } })}</span>` : ''}</li>`).join('')}${unm.map(e => `<li><span><b>${e.id}</b> ${chip('Unmatched')} ${$m(e.payload.Amount)} with reference "${esc(e.payload.BillRefNumber)}"<br><span class="muted small">${esc(e.note)}</span></span>${E.can('payment.reconcile') ? btn('assign', 'Assign to a lease', { sm: 1, d: { id: e.id } }) : ''}</li>`).join('')}${retry.map(e => `<li><span><b>${e.id}</b> ${chip('Retry queued')}<br><span class="muted small">${esc(e.note)}</span></span>${E.can('payment.reconcile') ? btn('retry', 'Retry posting', { sm: 1, cls: 'primary', d: { id: e.id } }) : ''}</li>`).join('')}</ul>` : '<div class="empty" style="padding:6px 0">Nothing to reconcile.</div>'}</div>
  <div class="panel flat scroll"><h2>All payments</h2><table class="t" style="margin-top:8px"><thead><tr><th>Payment</th><th>Lease</th><th>Purpose</th><th class="r">Amount</th><th>Status</th><th>Receipt</th><th></th></tr></thead><tbody>${all.map(p => `<tr><td>${p.id}<br><span class="muted small">${p.channel}, ${fd(p.requestedAt)}</span></td><td>${p.leaseId}</td><td>${p.purpose}</td><td class="r">${$m(p.amount)}</td><td>${chip(p.status)}${p.resultDesc && p.status !== 'Success' ? `<br><span class="muted small">${esc(p.resultDesc)}</span>` : ''}</td><td>${esc(p.providerTxId || '')}</td><td>${p.status === 'Success' ? (p.channel === 'STK Push' ? btn('replay', 'Replay callback', { sm: 1, d: { id: p.id } }) : '') + (E.can('payment.reconcile') ? btn('reverse', 'Reverse', { sm: 1, d: { id: p.id } }) : '') : ''}</td></tr>`).join('') || '<tr><td colspan="7" class="empty">No payments yet.</td></tr>'}</tbody></table></div>
  <div class="panel flat scroll" ${mc ? 'hidden' : ''}><h2>Provider events</h2><table class="t" style="margin-top:8px"><thead><tr><th>Event</th><th>Type</th><th>Outcome</th><th>What happened</th></tr></thead><tbody>${evs.map(e => `<tr><td>${e.id}<br><span class="muted small">${fd(e.date)}</span></td><td>${e.kind === 'STK' ? 'STK callback' : 'Paybill notice'}</td><td>${chip(e.status)}</td><td>${esc(e.note)}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">No events yet.</td></tr>'}</tbody></table></div>`;
}

/* ---------- collections ---------- */
function vCollections() {
  const tasks = E.s.tasks.slice().reverse(), dis = E.s.disputes.slice().reverse(), nt = E.s.notifs.slice().reverse().slice(0, 25);
  return `<h1>Collections</h1><p class="lede">Reminders go out before and after each due date. An installment turns overdue only after its grace period, and then one follow-up task is created. Officers record contact; they cannot add penalties or change terms.</p>
  <div class="panel flat scroll"><h2>Follow-up tasks</h2><table class="t" style="margin-top:8px"><thead><tr><th>Task</th><th>Customer</th><th class="r">Owed on installment</th><th>Status</th><th>Last contact</th><th></th></tr></thead><tbody>${tasks.map(t => { const L = E.lease(t.leaseId), i = L.installments.find(x => x.id === t.instId), lc = t.contacts[t.contacts.length - 1]; return `<tr><td><b>${esc(t.stage)}</b><br><span class="muted small">${t.id}, opened ${fd(t.createdAt)}</span></td><td><button class="link" data-act="openLease" data-id="${L.id}">${esc(custName(L.customerId))}</button><br><span class="muted small">${L.id}, installment ${i.no}</span></td><td class="r">${$m(E.instOutstanding(L, i))}</td><td>${chip(t.status)}${t.promiseDate ? `<br><span class="muted small">Promised ${fd(t.promiseDate)}</span>` : ''}${t.resolvedNote ? `<br><span class="muted small">${esc(t.resolvedNote)}</span>` : ''}</td><td>${lc ? `${fd(lc.date)}, ${esc(lc.outcome)}` : '<span class="muted">None yet</span>'}</td><td>${t.status !== 'Resolved' && E.can('collections.record') ? btn('contact', 'Log contact', { sm: 1, d: { id: t.id } }) : ''}</td></tr>`; }).join('') || '<tr><td colspan="6" class="empty">No follow-up tasks. Advance the date to see reminders and overdue tasks appear.</td></tr>'}</tbody></table></div>
  <div class="two"><div class="panel flat scroll"><h2>Disputes</h2><table class="t" style="margin-top:8px"><tbody>${dis.map(d => `<tr><td>${chip(d.status === 'Open' ? 'Disputed' : 'Resolved')}</td><td>${esc(d.reason)}<br><span class="muted small">${d.leaseId}, opened ${fd(d.openedAt)}${d.outcome ? ', outcome: ' + esc(d.outcome) : ''}</span></td><td>${d.status === 'Open' && E.can('dispute.manage') ? btn('resolveDispute', 'Resolve', { sm: 1, d: { id: d.id } }) : ''}</td></tr>`).join('') || '<tr><td class="empty">No disputes.</td></tr>'}</tbody></table></div>
  <div class="panel flat scroll"><h2>Message log</h2><table class="t" style="margin-top:8px"><tbody>${nt.map(n => `<tr><td>${fd(n.date)}<br><span class="muted small">${n.leaseId}</span></td><td>${n.template}${n.reason ? `<br><span class="muted small">${esc(n.reason)}</span>` : ''}</td><td>${chip(n.status)}</td></tr>`).join('') || '<tr><td class="empty">No messages yet.</td></tr>'}</tbody></table></div></div>`;
}

/* ---------- catalogue ---------- */
function vCatalogue() {
  const S = E.s.settings;

  simCode(el) { run(() => E.simResult(el.dataset.id, +el.dataset.code), 'Provider result received. Nothing was posted.'); },
  simWrong(el) { const p = E.pay(el.dataset.id); openForm({ title: 'Pay a different amount', intro: `Requested ${$m(p.amount)}. A mismatch is held for review and is not applied.`, fields: [{ n: 'a', l: 'Amount paid (KES)', t: 'number', v: p.amount / 100 - 500 }], onSubmit: v => { E.simPay(p.id, { amount: KES(+v.a) }); return 'Callback received with a different amount.'; } }); },
  simSpoof(el) { run(() => E.simPay(el.dataset.id, { authentic: false }), 'A forged callback was rejected and logged.'); },
  replay(el) { run(() => { const ev = E.s.events.slice().reverse().find(e => e.paymentId === el.dataset.id && e.payload.ResultCode === 0); E.as('M-PESA (simulated)', () => E.receiveCallback(ev.payload)); }, 'Same callback delivered again. No second posting.'); },
  toggle(el) { E.s.sim[el.dataset.k] = el.checked; save(); },
  c2b() { openForm({ title: 'Send a paybill payment', intro: 'The customer pays to the business paybill with the lease number as account reference. Try a wrong reference, or an amount above what is due.', submit: 'Send payment', fields: [{ n: 'r', l: 'Account reference', t: 'select', o: [...E.s.leases.map(l => [l.id, `${l.id}, ${custName(l.customerId)}`]), ['LSE-9999', 'LSE-9999 (unknown reference)']] }, { n: 'a', l: 'Amount (KES)', t: 'number', v: 2000 }], onSubmit: v => { E.simC2B({ ref: v.r, amount: KES(+v.a) }); return 'Paybill notice received.'; } }); },
  resolveQ(el) { reasonForm(el.dataset.k === 'apply' ? 'Apply as received' : 'Do not apply', 'Reason for this decision', 'Confirm', r => { E.resolveQuarantine(el.dataset.id, el.dataset.k, r); return 'Exception resolved.'; }); },
  assign(el) { openForm({ title: 'Assign to a lease', fields: [{ n: 'l', l: 'Lease', t: 'select', o: E.s.leases.map(l => [l.id, `${l.id}, ${custName(l.customerId)}`]) }, { n: 'r', l: 'Reason', t: 'textarea' }], onSubmit: v => { E.assignUnmatched(el.dataset.id, v.l, v.r.trim()); return 'Assigned and posted once.'; } }); },
  retry(el) { run(() => E.retryEvent(el.dataset.id), 'Posting retried safely.'); },
  reverse(el) { reasonForm('Reverse payment', 'Reason (for example, the Safaricom reversal reference)', 'Reverse', r => { E.reversePayment(el.dataset.id, r); return 'Reversal recorded and balance recalculated.'; }, 'This writes a linked reversal entry. The original payment stays in the ledger.'); },
  contact(el) { openForm({ title: 'Log contact', fields: [{ n: 'c', l: 'Channel', t: 'select', o: ['Phone call', 'SMS', 'WhatsApp', 'Visit'].map(x => [x, x]) }, { n: 'o', l: 'Outcome', t: 'select', o: ['Promised to pay', 'No answer', 'Refused to pay', 'Disputes the amount', 'Wrong number'].map(x => [x, x]) }, { n: 'd', l: 'Promised payment date', t: 'date', h: 'Only for "Promised to pay".' }, { n: 'n', l: 'Note', t: 'textarea' }], onSubmit: v => { E.recordContact(el.dataset.id, { channel: v.c, outcome: v.o, promiseDate: v.d, note: v.n }); return 'Contact logged.'; } }); },
  /* catalogue */
  newProduct() { openForm({ title: 'Add phone', fields: [{ n: 'code', l: 'Product code', p: 'GAL-A15-128' }, { n: 'brand', l: 'Brand' }, { n: 'model', l: 'Model' }, { n: 'storage', l: 'Storage', p: '128GB' }, { n: 'cond', l: 'Condition', t: 'select', o: [['New', 'New'], ['Refurbished', 'Refurbished']] }, { n: 'cash', l: 'Cash reference price (KES)', t: 'number' }], onSubmit: v => { E.addProduct({ code: v.code.trim(), brand: v.brand.trim(), model: v.model.trim(), storage: v.storage, condition: v.cond, cashPrice: KES(+v.cash) }); return 'Phone added. Add a price to make it available.'; } }); },
  newPricing() { priceForm(null); },
  revisePrice(el) { priceForm(E.pricing(el.dataset.id)); },
  activatePrice(el) { run(() => E.activatePricing(el.dataset.id), 'Price activated. Earlier versions stay with signed agreements.'); },
  deactivatePrice(el) { run(() => E.deactivatePricing(el.dataset.id), 'Price deactivated for new applications.'); },
  settings() {
    const S = E.s.settings, k = x => x / 100;
    openForm({ title: 'Edit policy', intro: 'Existing signed agreements keep their own terms.', fields: [{ n: 'du', l: 'Permitted durations (months, comma separated)', v: S.durations.join(', ') }, { n: 'gr', l: 'Default grace period (days)', t: 'number', v: S.graceDays }, { n: 'rs', l: 'Reservation hold (days from approval)', t: 'number', v: S.reservationDays }, { n: 'al', l: 'Approver limit (KES, total lease price)', t: 'number', v: k(S.approverLimit) }, { n: 'sl', l: 'Senior Approver limit (KES)', t: 'number', v: k(S.seniorLimit) }, { n: 'el', l: 'Exposure limit per customer (KES)', t: 'number', v: k(S.exposureLimit) }, { n: 'af', l: 'Affordability limit (% of income)', t: 'number', v: S.affordability }, { n: 'ds', l: 'Maximum debt service ratio (%)', t: 'number', v: S.maxDsr }, { n: 'mi', l: 'Minimum monthly income (KES)', t: 'number', v: k(S.minIncome) }, { n: 'co', l: 'Company name on agreements', v: S.company }, { n: 'pb', l: 'Paybill number on agreements', v: S.paybill }, { n: 'ao', l: 'System transfers ownership automatically when every completion check passes', t: 'checkbox', v: S.autoOwnership }],
      onSubmit: v => { const du = v.du.split(',').map(x => +x.trim()).filter(x => Number.isInteger(x) && x > 0); if (!du.length) throw new Error('Enter at least one duration.'); E.updateSettings({ durations: du, graceDays: +v.gr, reservationDays: +v.rs, approverLimit: KES(+v.al), seniorLimit: KES(+v.sl), exposureLimit: KES(+v.el), affordability: +v.af, maxDsr: +v.ds, minIncome: KES(+v.mi), company: v.co.trim(), paybill: v.pb.trim(), autoOwnership: v.ao }); return 'Policy saved.'; } });
  },
  clauses() { const S = E.s.settings; openForm({ title: 'Agreement wording', intro: 'New agreement versions use this wording. Signed agreements keep the text they were signed with. You can use {phone}, {paybill}, {grace} and {company}.', fields: CLAUSE_KEYS.map(k => ({ n: k, l: CLAUSE_TITLES[k], t: 'textarea', v: S.clauses[k] })), onSubmit: v => { E.updateSettings({ clauses: Object.fromEntries(CLAUSE_KEYS.map(k => [k, v[k].trim()])) }); return 'Wording saved for new agreements.'; } }); },
  perm(el) { run(() => E.setPermission(el.dataset.a, el.dataset.r, el.checked), 'Access updated and logged.'); },
  permReset() { if (!confirm('Reset every permission to the approved defaults?')) return; run(() => E.resetPermissions(), 'Permissions reset to the approved defaults.'); },
  newDevice() { const sug = makeImei('35' + String(Math.floor(Math.random() * 1e12)).padStart(12, '0')); openForm({ title: 'Register phone', fields: [{ n: 'p', l: 'Model', t: 'select', o: E.s.products.map(p => [p.id, prodName(p.id)]) }, { n: 'i', l: 'IMEI', v: sug, h: '15 digits with a valid check digit. A valid sample is filled in.' }, { n: 'c', l: 'Condition', v: 'New' }], onSubmit: v => { E.registerDevice({ imei: v.i.trim(), productId: v.p, condition: v.c }); return 'Phone registered.'; } }); },
  quarantine(el) { const on = el.dataset.on === '1'; reasonForm(on ? 'Quarantine phone' : 'Release phone', 'Reason', on ? 'Quarantine' : 'Release', r => { E.setQuarantine(el.dataset.id, on, r); return on ? 'Phone quarantined.' : 'Phone released to stock.'; }); },
  runAll() { ui.tests = {}; TESTS.forEach(t => ui.tests[t.id] = runTest(t)); render(); const f = Object.values(ui.tests).filter(r => !r.pass).length; toast(f ? `${f} test(s) failed.` : `All ${TESTS.length} tests passed.`, f ? 'bad' : ''); },
  runOne(el) { const t = TESTS.find(x => x.id === el.dataset.id); ui.tests[t.id] = runTest(t); render(); },
};
function termsSummary(o) { return `Deposit ${$m(o.deposit)}, then ${o.count} monthly installments of ${$m(o.installments[0])}${o.installments[o.count - 1] !== o.installments[0] ? ` (the last is ${$m(o.installments[o.count - 1])})` : ''}. Total payable ${$m(o.total)}.`; }
function priceForm(base) {
  openForm({ title: base ? `New version of ${prodName(base.productId)}, ${base.months} months` : 'Add price', intro: base ? 'Creates a draft. The current version keeps serving signed agreements.' : 'New prices start as drafts and need activation.', fields: [
    ...(base ? [] : [{ n: 'p', l: 'Phone', t: 'select', o: E.s.products.map(p => [p.id, prodName(p.id)]) }, { n: 'm', l: 'Duration', t: 'select', o: E.s.settings.durations.map(m => [m, m + ' months']) }]),
    { n: 't', l: 'Total lease price (KES)', t: 'number', v: base ? base.total / 100 : '' }, { n: 'dt', l: 'Deposit rule', t: 'select', o: [['fixed', 'Fixed amount (KES)'], ['percent', 'Percentage of total']], v: base ? base.depositType : 'fixed' },
    { n: 'dv', l: 'Deposit value', t: 'number', v: base ? (base.depositType === 'percent' ? base.depositValue : base.depositValue / 100) : '', h: 'KES for a fixed amount, or a percentage.' }, { n: 'g', l: 'Grace period (days)', t: 'number', v: base ? base.graceDays : E.s.settings.graceDays }, { n: 'f', l: 'Effective from', t: 'date', v: base ? E.s.date : E.s.date }],
    onSubmit: v => {
      const d = { total: KES(+v.t), depositType: v.dt, depositValue: v.dt === 'fixed' ? KES(+v.dv) : +v.dv, graceDays: +v.g, from: v.f };
      const p = base ? E.revisePricing(base.id, d) : E.addPricing({ productId: v.p, months: +v.m, ...d }); const e = E.validatePricing(p);
      return e.length ? 'Saved as a draft, but it cannot be activated yet: ' + e[0] : 'Draft saved. Activate it to offer it to customers.';
    } });
}
document.addEventListener('input', ev => {
  if (ev.target.id !== 'q') return; const r = searchAll(ev.target.value), box = $('#sres');
  box.innerHTML = ev.target.value.trim().length < 2 ? '' : r.length ? r.map(x => `<button data-act="${x.act}" data-id="${x.id}">${esc(x.t)}<span>${esc(x.s)}</span></button>`).join('') : '<p>No match.</p>';
});
document.addEventListener('click', ev => {
  if (!ev.target.closest('.search-box')) { const b = $('#sres'); if (b) b.innerHTML = ''; } const el = ev.target.closest('[data-act]'); if (!el || el.tagName === 'SELECT' || el.tagName === 'INPUT') return; if (el.disabled) return; const f = H[el.dataset.act]; if (f) f(el); });
document.addEventListener('change', ev => {
  const el = ev.target; if (el.matches('select[data-act],input[data-act]')) { const f = H[el.dataset.act]; if (f) f(el); return; }
  if (el.matches('input[data-doc]')) { const f = el.files[0]; if (f) run(() => E.uploadDoc(ui.appId, el.dataset.doc, f.name, Math.round(f.size / 1024)), 'Document received.'); }
});
function showTime() {
  const el = document.getElementById('currentTime'); if (!el) return;
  const now = new Date();
  const date = new Intl.DateTimeFormat('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }).format(now);
  const time = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(now);
  el.textContent = `${date} · ${time}`;
}
E = loadEngine(); E.role = 'Super Admin'; save(); render();
showTime();
setInterval(showTime, 1000);
</script>
